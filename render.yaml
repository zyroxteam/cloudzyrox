services:
  - type: web
    name: zyrox-cloud-pannel
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PUTER_TOKEN
        sync: false
      - key: ACCESS_TOKEN
        generateValue: true
      - key: DASHBOARD_KEY
        generateValue: true
      - key: DEFAULT_MODEL
        value: anthropic/claude-sonnet-5
      - key: MODELS
        value: anthropic/claude-haiku-4-5,anthropic/claude-sonnet-5,anthropic/claude-opus-4-8,anthropic/claude-opus-5,anthropic/claude-fable-5,z-ai/glm-4.7,z-ai/glm-4.6,z-ai/glm-4.5,deepseek/deepseek-v4-pro:free,moonshotai/kimi-k2.6:free,qwen/qwen3.6-plus:free,minimax/minimax-m2.5:free,minimax/minimax-m2.7:free,openai/gpt-oss-20b:free,google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,cohere/north-mini-code:free,poolside/laguna-s-2.1:free,poolside/laguna-xs-2.1:free,inclusionai/ling-3.0-tiny:free,nvidia/nemotron-3-super-120b-a12b:free,nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3-nano-30b-a3b:free
      - key: CORS_ORIGIN
        value: "*"

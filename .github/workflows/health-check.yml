name: Render health monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          test -n "$RENDER_URL" || { echo "Add RENDER_URL in repository secrets first"; exit 1; }
          curl --fail --silent --show-error --max-time 20 "$RENDER_URL/health" | tee health.json
          grep -q '"ok":true' health.json
